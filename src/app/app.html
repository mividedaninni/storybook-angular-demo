<sbb-form-field size="s" width="collapse">
  <label for="input">Custom input</label>
  <sbb-custom-control-input/>
</sbb-form-field>
<sbb-form-field size="s" width="collapse">
  <label for="a">Native input</label>
  <input id="a"/>
</sbb-form-field>
<sbb-form-field size="s" width="collapse">
  <label for="select">Custom select</label>
  <sbb-custom-control-select/>
</sbb-form-field>
<sbb-form-field size="s" width="collapse">
  <label for="z">Native select</label>
  <select id="z">
    <option value="bern">Bern</option>
    <option value="zurich">Zürich</option>
    <option value="basel">Basel</option>
    <option value="geneva">Geneva</option>
    <option value="lausanne">Lausanne</option>
  </select>
</sbb-form-field>
<sbb-form-field size="s" width="collapse">
  <label for="textarea">Custom textarea</label>
  <sbb-custom-control-textarea/>
</sbb-form-field>
<sbb-form-field size="s" width="collapse">
  <label for="z">Native textarea</label>
  <textarea id="z" rows="3"></textarea>
</sbb-form-field>

<div>
  <button (click)="openDialog()">open dialog</button>
</div>
